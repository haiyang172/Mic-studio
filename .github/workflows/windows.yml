name: Windows build and verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Build native app, audio modules, components, setup and verification projects
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify DSP, APO, WASAPI, bundled component and setup without installing drivers
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Publish portable Windows x64 application
        shell: pwsh
        run: ./scripts/Publish.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: MicStudio-win-x64
          path: |
            dist/MicStudio-win-x64.zip
            dist/MicStudio.Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
